name = "bawal-camera-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "RelayRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[vars]
RELAY_DEFAULT_DEVICE = "default"
# Only allow browsers on the same public network (same NAT as the ESP32) to
# watch. Set to "1" to restore the old public view-key-only behaviour.
RELAY_ALLOW_REMOTE_VIEW = "0"
