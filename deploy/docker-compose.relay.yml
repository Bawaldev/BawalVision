# ==============================================================================
# BawalVision camera relay for an Oracle Cloud Always Free VM
#
#   docker compose -f deploy/docker-compose.relay.yml --env-file .env up -d --build
#
# Caddy terminates TLS (Let's Encrypt) and proxies WSS to the relay container.
# Only ports 80/443 are published; the relay itself stays on the private
# compose network.
# ==============================================================================

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    container_name: bawal_relay
    restart: unless-stopped
    environment:
      PORT: "8080"
      RELAY_INGEST_KEY: ${RELAY_INGEST_KEY:?Set RELAY_INGEST_KEY in .env}
      RELAY_VIEW_KEY: ${RELAY_VIEW_KEY:-}
      RELAY_DEFAULT_DEVICE: ${CAMERA_RELAY_DEVICE:-default}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: bawal_relay_caddy
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?Set RELAY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.relay:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
