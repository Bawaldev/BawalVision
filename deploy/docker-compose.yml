services:
  postgres:
    image: postgres:16-alpine
    container_name: bawal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bawal_vision}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/shema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    networks:
      - bawal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bawal_vision}"]
      interval: 3s
      timeout: 5s
      retries: 10

  bawal_backend:
    image: bawal-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: bawal_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ../.env
        required: false
    environment:
      CROW_PORT: "8080"
      CROW_BIND: "0.0.0.0"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-bawal_vision}
      DB_SSLMODE: disable
      MODEL_PATH: ${MODEL_PATH:-/app/ml/AI1/model/yolov8s_int8/ai1_vision_int8.onnx}
      OMP_NUM_THREADS: "4"
      OMP_WAIT_POLICY: PASSIVE
      OMP_SCHEDULE: static
      OMP_PROC_BIND: "true"
      CAMERA_VFLIP: ${CAMERA_VFLIP:-1}
      CAMERA_HFLIP: ${CAMERA_HFLIP:-0}
      CONF_THRESHOLD: ${CONF_THRESHOLD:-0.35}
      ENABLE_SR: "0"
    volumes:
      - ../ml/AI1/model:/app/ml/AI1/model:ro
      - ../weights:/app/weights:ro
      - ../examples:/app/examples:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bawal-net

  frontend:
    image: bawal-frontend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: bawal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      BACKEND_URL: http://bawal_backend:8080
      HOST: 0.0.0.0
      PORT: "3000"
    depends_on:
      - bawal_backend
    networks:
      - bawal-net

volumes:
  postgres_data:
    driver: local

networks:
  bawal-net:
    driver: bridge
