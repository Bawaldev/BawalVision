services:
  postgres:
    image: postgres:16-alpine
    container_name: bawal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bawal_vision}
    ports:
      - "${POSTGRES_PORT:-5433}:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/internal/data/templates/shema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - bawal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bawal_vision}"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    image: bawal-backend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: bawal_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-bawal_vision}
      - DB_PORT=5432
      - DB_SSLMODE=disable
      - WIFI_SSID=${WIFI_SSID:-}
      - WIFI_PASS=${WIFI_PASS:-}
      - BACKEND_IP=${BACKEND_IP:-}
    privileged: true
    volumes:
      - /dev:/dev
      - /sys:/sys:ro
      - ../.cache_trash:/app/.cache_trash:ro
    group_add:
      - dialout
    device_cgroup_rules:
      - 'c *:* rmw'
    networks:
      - bawal-net
    depends_on:
      postgres:
        condition: service_healthy

  vision:
    image: bawal-vision:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vision
    container_name: bawal_vision
    restart: unless-stopped
    ports:
      - "${VISION_PORT:-8081}:8080"
    environment:
      - HEADLESS=1
      - QT_QPA_PLATFORM=offscreen
      - BACKEND_HOST=backend
      - BACKEND_PORT=8080
      - MODEL_PATH=${MODEL_PATH:-/app/ml/AI1/model/ai1_vision_int8.onnx}
      - OMP_WAIT_POLICY=PASSIVE
      - OMP_NUM_THREADS=2
      - OMP_SCHEDULE=static
      - CAMERA_VFLIP=${CAMERA_VFLIP:-1}
      - CAMERA_HFLIP=${CAMERA_HFLIP:-0}
      - CONF_THRESHOLD=${CONF_THRESHOLD:-0.58}
    volumes:
      - ../weights:/app/weights:rw
      - ../ml/AI1/model:/app/ml/AI1/model:ro
    networks:
      - bawal-net
    depends_on:
      - backend

  frontend:
    image: bawal-frontend:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: bawal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - HOST=0.0.0.0
      - PORT=3000
    networks:
      - bawal-net
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local

networks:
  bawal-net:
    driver: bridge