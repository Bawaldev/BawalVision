# ==============================================================================
# BawalVision Microservices Orchestration (Local & Edge Industrial Stack)
# Services: PostgreSQL, Go Gateway, C++ Vision Engine, SvelteKit HMI, Python ML
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: bawal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-bawal_vision}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bawal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bawal_vision}"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: bawal_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-bawal_vision}
      - DB_PORT=5432
      - DB_SSLMODE=disable
    networks:
      - bawal-net
    depends_on:
      postgres:
        condition: service_healthy

  vision:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vision
    container_name: bawal_vision
    restart: unless-stopped
    ports:
      - "${VISION_PORT:-8081}:8080"
    environment:
      - HEADLESS=1
      - QT_QPA_PLATFORM=offscreen
      - BACKEND_URL=http://backend:8080
      - OMP_NUM_THREADS=4
      - OMP_SCHEDULE=static
      - OMP_PROC_BIND=true
    volumes:
      - ../ml/AI1/model:/app/ml/AI1/model:ro
    networks:
      - bawal-net
    depends_on:
      - backend

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: bawal_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - HOST=0.0.0.0
      - PORT=3000
    networks:
      - bawal-net
    depends_on:
      - backend

  ml:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ml
    container_name: bawal_ml
    profiles:
      - ml
      - training
    volumes:
      - ../ml:/app/ml
    networks:
      - bawal-net

volumes:
  postgres_data:
    driver: local

networks:
  bawal-net:
    driver: bridge