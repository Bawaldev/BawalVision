services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bawal_vision
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - bawal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bawal_vision"]
      interval: 3s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bawal_backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=bawal_vision
      - DB_PORT=5432
      - DB_SSLMODE=disable
    networks:
      - bawal-net
    depends_on:
      postgres:
        condition: service_healthy

  vision:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.vision
    container_name: bawal_vision
    ports:
      - "${VISION_PORT:-8081}:8080"
    environment:
      - HEADLESS=1
      - QT_QPA_PLATFORM=offscreen
      - BACKEND_URL=http://backend:8080
      - OMP_NUM_THREADS=4
    networks:
      - bawal-net
    depends_on:
      - backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: bawal_frontend
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - HOST=0.0.0.0
      - PORT=3000
    networks:
      - bawal-net
    depends_on:
      - backend

networks:
  bawal-net:
    driver: bridge