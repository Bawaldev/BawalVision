name: Docker Image Build Matrix

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: bawal-backend
            dockerfile: deploy/Dockerfile.backend
          - name: bawal-vision
            dockerfile: deploy/Dockerfile.vision
          - name: bawal-frontend
            dockerfile: deploy/Dockerfile.frontend
    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target.name }} via BuildKit Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.name }}
