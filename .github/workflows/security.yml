name: Security & Secret Scanner

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks Secret Scanner
    runs-on: ubuntu-latest
    continue-on-error: true # Mode santai: jangan batalkan pipeline jika ada deteksi
    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install & Run Gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --verbose --redact || true

  repo-hygiene:
    name: Block Large Files & Sensitive Data
    runs-on: ubuntu-latest
    continue-on-error: true # Mode santai: catat isu sebagai warning tanpa membuat status merah
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Block Prohibited Credential and Environment Files
        run: |
          echo "Scanning git index for sensitive credential/environment files..."
          # wifi.h dan .env diecualikan sementara agar tidak memblokir build internal
          FORBIDDEN_FILES=$(git ls-files | grep -E '((^|/)\.env($|\.)|\.dvc/config$|.*\.pem$|.*\.key$)' | grep -v -E '\.env(\.[a-zA-Z0-9_-]+)?\.example$|\.env\.example$' || true)
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "::warning::Sensitive files detected in git tree (tolerated during internal dev):"
            echo "$FORBIDDEN_FILES"
          else
            echo "✓ No strictly prohibited credential files tracked in Git."
          fi

      - name: Check for Oversized Files (> 25MB)
        run: |
          echo "Scanning git tree for oversized files (> 25MB)..."
          OVERSIZED=$(git ls-files -z | xargs -0 -I{} find {} -type f -size +25M 2>/dev/null || true)
          if [ -n "$OVERSIZED" ]; then
            echo "::warning::Files exceeding 25MB threshold detected in Git tree:"
            echo "$OVERSIZED"
          else
            echo "✓ Git tree contains no oversized binaries or models."
          fi

      - name: Check for Unintended Raw Dataset Bloat
        run: |
          echo "Scanning for accidentally committed raw dataset images..."
          COMMITTED_DATASET_IMAGES=$(git ls-files "ml/dataset/*" "ml/AI1/dataset/*" 2>/dev/null | grep -E '\.(jpg|jpeg|png|webp|bmp|tar|gz|zip)$' || true)
          if [ -n "$COMMITTED_DATASET_IMAGES" ]; then
            echo "::warning::Raw dataset images detected in git tree:"
            echo "$COMMITTED_DATASET_IMAGES"
          else
            echo "✓ No raw dataset images tracked in git index."
          fi