name: AWS Lambda CI & RIE Smoke Test

on:
  push:
    paths:
      - 'deploy/Dockerfile.lambda'
      - 'deploy/lambda-entrypoint.sh'
      - 'services/include/bawal/lambda/**'
      - 'services/src/lambda/**'
      - 'aws-infra/**'
      - '.github/workflows/lambda-ci.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'deploy/Dockerfile.lambda'
      - 'deploy/lambda-entrypoint.sh'
      - 'services/include/bawal/lambda/**'
      - 'services/src/lambda/**'
      - 'aws-infra/**'
      - '.github/workflows/lambda-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lambda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lambda-build-rie:
    name: Build Lambda Container & RIE Smoke Test
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lambda Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.lambda
          load: true
          tags: bawal-lambda:test
          cache-from: type=gha,scope=bawal-lambda
          cache-to: type=gha,mode=max,scope=bawal-lambda

      - name: Execute RIE Emulator Smoke Test
        run: |
          echo "[CI] Starting Lambda container with Runtime Interface Emulator..."
          docker run -d --name lambda-rie -p 8080:8080 bawal-lambda:test
          
          echo "[CI] Waiting for RIE runtime API to become available..."
          for i in {1..30}; do
            if curl -s "http://localhost:8080/2015-03-31/functions/function/invocations" -d '{}' >/dev/null 2>&1; then
              echo "[CI] RIE ready on attempt $i"
              break
            fi
            sleep 1
          done

          echo "[CI] Sending health check event..."
          RESPONSE=$(curl -fsSL -X POST "http://localhost:8080/2015-03-31/functions/function/invocations" \
            -H "Content-Type: application/json" \
            -d '{"rawPath": "/api/v1/lambda/health", "requestContext": {"http": {"method": "GET"}}}')
          
          echo "[CI] RIE Response: $RESPONSE"
          echo "$RESPONSE" | grep -q "bawal::lambda" || {
            echo "[ERROR] Unexpected RIE response"
            docker logs lambda-rie
            exit 1
          }

          echo "[CI] Stopping container..."
          docker stop lambda-rie
