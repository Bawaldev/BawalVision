name: "🐛 Bug Report"
description: Report an issue or unexpected behavior in BawalVision
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much context as possible to help us reproduce and fix it quickly.

  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      description: Which part of the BawalVision monorepo is experiencing the issue?
      options:
        - "C++20 Vision Service (services/)"
        - "Go Fiber Backend (backend/)"
        - "ESP32-S3 Edge Firmware (edge/)"
        - "SvelteKit 5 Frontend (frontend/)"
        - "Machine Learning & Models (ml/)"
        - "Docker & Deployment (deploy/)"
        - "Build System & Justfile (scripts/)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Run 'just ...' or 'docker compose up'
        2. Ingest camera stream from ESP32
        3. Trigger inspection ...
        4. See error in log ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead?
      placeholder: Expected 30 FPS stream with bounding boxes, but got...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Hardware Specs
      description: Please share your environment details to reproduce the bug.
      value: |
        - **OS**: Linux (Fedora / Ubuntu / Debian) / macOS / Windows WSL2
        - **CPU Architecture**: x86_64 (AVX2/AVX-512) / ARM64 (Apple Silicon / Graviton)
        - **Compiler**: GCC 14 / Clang 18 / Apple Clang
        - **ESP-IDF Version**: v5.x / v6.1 (if edge bug)
        - **Camera Sensor**: OV5640 / OV2640 / USB UVC
        - **Docker / Compose Version**: 
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Crash Traces
      description: Paste relevant terminal output, Docker logs, or GDB/TSan crash backtraces.
      render: shell

